<!DOCTYPE html>
<html lang="vi">
  <head>
    <title>Crossy Road Game</title>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#7ec8e3" />
    <link rel="stylesheet" href="style.css?v=2" />
  </head>
  <body>
    <div id="hit-flash"></div>
    <div id="hud">
      <div id="score-box">
        <span id="score-label">SCORE</span>
        <div id="counter">0</div>
        <div id="score-pop"></div>
      </div>
    </div>

    <div id="hint">Vuốt màn hình hoặc dùng nút</div>

    <div id="controlls">
      <div>
        <button id="forward" type="button" aria-label="Tiến">
          <svg width="28" height="28" viewBox="0 0 10 10">
            <g transform="rotate(0, 5,5)">
              <path d="M5,4 L7,6 L3,6 L5,4" />
            </g>
          </svg>
        </button>
        <button id="left" type="button" aria-label="Trái">
          <svg width="28" height="28" viewBox="0 0 10 10">
            <g transform="rotate(-90, 5,5)">
              <path d="M5,4 L7,6 L3,6 L5,4" />
            </g>
          </svg>
        </button>
        <button id="backward" type="button" aria-label="Lùi">
          <svg width="28" height="28" viewBox="0 0 10 10">
            <g transform="rotate(180, 5,5)">
              <path d="M5,4 L7,6 L3,6 L5,4" />
            </g>
          </svg>
        </button>
        <button id="right" type="button" aria-label="Phải">
          <svg width="28" height="28" viewBox="0 0 10 10">
            <g transform="rotate(90, 5,5)">
              <path d="M5,4 L7,6 L3,6 L5,4" />
            </g>
          </svg>
        </button>
      </div>
    </div>

    <div id="end">
      <div class="end-card">
        <p>Game Over</p>
        <button id="retry" type="button">Retry</button>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/99/three.min.js"></script>
    <script src="script.js?v=2"></script>
  </body>
</html>
